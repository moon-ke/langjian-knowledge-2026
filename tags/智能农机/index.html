<div id="lj-gate"><div class="lj-box"><h3>阅读验证</h3><p>请关注公众号「广工学习通」，发送关键词 <b>验证码</b>，获取阅读密码后填写，即可正常阅读</p><input id="lj-key" class="lj-key" type="password" placeholder="请输入阅读密码" autocomplete="off"><div class="lj-err"></div><button id="lj-btn" class="lj-btn" type="button">确认阅读</button><div class="lj-hint">验证一次，全站解锁</div></div></div>
<script>
(function(){
  var KEY='1yzx',OK='lj_unlocked';
  try{if(localStorage.getItem(OK)==='1yzx')return;}catch(e){}
  var g=document.getElementById('lj-gate'),i=document.getElementById('lj-key'),e=g.querySelector('.lj-err');
  function unlock(){
    try{
      if(i.value.trim()===KEY){localStorage.setItem(OK,'1yzx');g.parentNode.removeChild(g);}
      else{e.textContent='密码错误，请重新输入';i.select();}
    }catch(err){}
  }
  document.getElementById('lj-btn').addEventListener('click',unlock);
  i.addEventListener('keydown',function(ev){if(ev.key==='Enter')unlock();});
  i.focus();
})();
</script>
